<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio Site Wireframe</title>
  <desc id="desc">Wireframe for a three-page portfolio site showing Home, Projects, and About pages with color and font notes.</desc>

  <rect width="1200" height="700" fill="#f5f5f5"/>

  <text x="60" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold">Portfolio Site Plan / Wireframe</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="20">Color palette: white background, dark gray text, blue accents</text>
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="20">Font choice: Arial or Helvetica</text>

  <rect x="60" y="170" width="320" height="430" fill="#ffffff" stroke="#2d2d2d" stroke-width="2"/>
  <text x="90" y="205" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Home Page</text>
  <rect x="90" y="225" width="260" height="40" fill="#dfeef7" stroke="#666"/>
  <text x="110" y="252" font-family="Arial, sans-serif" font-size="16">Navigation</text>
  <rect x="90" y="285" width="260" height="70" fill="#f0f0f0" stroke="#666"/>
  <text x="110" y="325" font-family="Arial, sans-serif" font-size="18">Hero / Intro</text>
  <rect x="90" y="375" width="260" height="90" fill="#f0f0f0" stroke="#666"/>
  <text x="110" y="420" font-family="Arial, sans-serif" font-size="18">Featured Work</text>
  <rect x="90" y="485" width="260" height="60" fill="#dfeef7" stroke="#666"/>
  <text x="110" y="522" font-family="Arial, sans-serif" font-size="18">Footer</text>

  <rect x="440" y="170" width="320" height="430" fill="#ffffff" stroke="#2d2d2d" stroke-width="2"/>
  <text x="470" y="205" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Projects Page</text>
  <rect x="470" y="225" width="260" height="40" fill="#dfeef7" stroke="#666"/>
  <text x="490" y="252" font-family="Arial, sans-serif" font-size="16">Navigation</text>
  <rect x="470" y="285" width="260" height="55" fill="#f0f0f0" stroke="#666"/>
  <text x="490" y="320" font-family="Arial, sans-serif" font-size="18">Page Title</text>
  <rect x="470" y="360" width="260" height="80" fill="#f0f0f0" stroke="#666"/>
  <text x="490" y="405" font-family="Arial, sans-serif" font-size="18">Project Card 1</text>
  <rect x="470" y="455" width="260" height="80" fill="#f0f0f0" stroke="#666"/>
  <text x="490" y="500" font-family="Arial, sans-serif" font-size="18">Project Card 2</text>

  <rect x="820" y="170" width="320" height="430" fill="#ffffff" stroke="#2d2d2d" stroke-width="2"/>
  <text x="850" y="205" font-family="Arial, sans-serif" font-size="24" font-weight="bold">About Page</text>
  <rect x="850" y="225" width="260" height="40" fill="#dfeef7" stroke="#666"/>
  <text x="870" y="252" font-family="Arial, sans-serif" font-size="16">Navigation</text>
  <rect x="850" y="285" width="260" height="55" fill="#f0f0f0" stroke="#666"/>
  <text x="870" y="320" font-family="Arial, sans-serif" font-size="18">About Intro</text>
  <rect x="850" y="360" width="260" height="80" fill="#f0f0f0" stroke="#666"/>
  <text x="870" y="405" font-family="Arial, sans-serif" font-size="18">Goals</text>
  <rect x="850" y="455" width="260" height="80" fill="#f0f0f0" stroke="#666"/>
  <text x="870" y="500" font-family="Arial, sans-serif" font-size="18">Contact</text>
</svg>
